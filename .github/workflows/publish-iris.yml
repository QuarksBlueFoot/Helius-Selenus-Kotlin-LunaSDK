name: Publish IrisSDK to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Import GPG Key
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.SIGNING_KEY }}
        passphrase: ${{ secrets.SIGNING_PASSWORD }}
        
    - name: Verify GPG Key
      run: |
        gpg --list-secret-keys --keyid-format LONG
        echo "GPG key imported successfully"

    - name: Clean build
      run: ./gradlew clean

    - name: Run Iris SDK tests
      run: ./gradlew :iris-sdk:test

    - name: Build Iris SDK
      run: ./gradlew :iris-sdk:build

    - name: Publish Iris SDK to Maven Central
      run: |
        ./gradlew :iris-sdk:publish \
          -Psigning.keyId=${{ secrets.SIGNING_KEY_ID }} \
          -Psigning.password=${{ secrets.SIGNING_PASSWORD }} \
          -PcentralUsername=${{ secrets.CENTRAL_USERNAME }} \
          -PcentralPassword=${{ secrets.CENTRAL_PASSWORD }}
      env:
        USE_GPG_AGENT: "true"
